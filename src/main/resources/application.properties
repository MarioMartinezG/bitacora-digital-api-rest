# ===== INFORMACIÓN DE LA APLICACIÓN =====
spring.application.name=Bitacora-digital
server.port=8080
server.servlet.context-path=/

# ===== BASE DE DATOS POSTGRESQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/teia_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=teia_user
spring.datasource.password=teia_password

# Configuración del pool de conexiones Hikari (recomendado)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Mejoras de rendimiento JPA
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.open-in-view=false

# ===== JWT CONFIGURATION =====
jwt.secret=/kgDXgvjsnczjJKOWUC910j6TeR04o8Z/H+VBy9ce0lBmnnZsX0Mzr9xwzg4ZHT80sUphiM8uw3PT70z0twsSA==
jwt.expiration=3600
jwt.refresh-expiration=86400

# ===== SPRING SECURITY =====
# Configuración básica de seguridad
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

# ===== LOGGING CONFIGURATION =====

# Niveles específicos por paquete
logging.level.com.diginexa=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuración de formato
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan(%logger{36}) - %msg%n

# Archivo de log (opcional)
logging.file.name=logs/bitacora-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Tamaño máximo y rotación de logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ===== VALIDATION =====
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ===== JACKSON (JSON) =====
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.date-format=com.fasterxml.jackson.databind.util.StdDateFormat
spring.jackson.time-zone=America/Bogota

# ===== MULTIPART FILE UPLOADS (si aplica) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB