# =============================================
# BITACORA DIGITAL - Configuracion de Aplicacion
# =============================================

spring.application.name=bitacora-digital
server.port=8080

# =============================================
# BASE DE DATOS POSTGRESQL
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teia_db}
spring.datasource.username=${DB_USERNAME:teia_user}
spring.datasource.password=${DB_PASSWORD:teia_password}

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Optimizacion de batch
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# =============================================
# JWT - AUTENTICACION
# =============================================
jwt.secret=${JWT_SECRET:/kgDXgvjsnczjJKOWUC910j6TeR04o8Z/H+VBy9ce0lBmnnZsX0Mzr9xwzg4ZHT80sUphiM8uw3PT70z0twsSA==}
jwt.expiration=3600
jwt.refresh-expiration=86400

# =============================================
# LOGGING
# =============================================
logging.level.root=INFO
logging.level.com.diginexa=INFO
logging.level.org.springframework.security=WARN

# Archivo de logs
logging.file.name=logs/bitacora-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Rotacion de logs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# =============================================
# JACKSON (JSON)
# =============================================
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# =============================================
# OTROS
# =============================================
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB