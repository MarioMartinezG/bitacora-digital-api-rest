# =============================================
# BITACORA DIGITAL - Configuracion de Tests
# =============================================
# Este perfil usa la misma BD PostgreSQL pero con
# @Transactional para rollback automatico

spring.application.name=bitacora-digital-test

# =============================================
# BASE DE DATOS POSTGRESQL (TESTS)
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teia_db}
spring.datasource.username=${DB_USERNAME:teia_user}
spring.datasource.password=${DB_PASSWORD:teia_password}

# Pool reducido para tests
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# =============================================
# JPA / HIBERNATE (TESTS)
# =============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# LOGGING (TESTS)
# =============================================
logging.level.root=WARN
logging.level.com.diginexa=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.springframework.security=WARN

# Desactivar logs de archivo en tests
logging.file.name=

# =============================================
# EMAIL - DESHABILITADO EN TESTS
# =============================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# =============================================
# NOTIFICACIONES - SCHEDULER DESHABILITADO
# =============================================
# Cron que nunca se ejecuta (31 de febrero)
notificaciones.scheduler.cron=0 0 0 31 2 ?

# =============================================
# APLICACION
# =============================================
app.name=Bitacora Digital Tests

# =============================================
# JWT - CLAVE FIJA PARA TESTS (Base64 encoded, 64 bytes)
# =============================================
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=
jwt.expiration=3600
jwt.refresh-expiration=86400
