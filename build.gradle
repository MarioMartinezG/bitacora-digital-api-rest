plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.diginexa'
version = '0.0.1-SNAPSHOT'
description = 'API REST utilizado en la bitácora digital del curso institucional "En sus marcas, listos, ¡RAC!"'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

bootWar {
	archiveFileName = 'app.war'
}

war {
	enabled = false
}

dependencies {
	// Spring Boot Starters (ESENCIALES)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// WebSocket (NOTIFICACIONES EN TIEMPO REAL)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Email (NOTIFICACIONES POR CORREO)
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// JWT (AUTENTICACIÓN)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Lombok (PRODUCTIVIDAD)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// PostgreSQL (BASE DE DATOS)
	runtimeOnly 'org.postgresql:postgresql'

	// Cloud SQL Auth Proxy - conexion segura a Cloud SQL desde Cloud Run
	// Solo activo cuando la URL incluye el parametro socketFactory
	runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.21.0'

	// Testing (PRUEBAS)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
